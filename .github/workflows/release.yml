name: Release desktop app

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.0-dev \
            patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Rust build tools
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13,tauri-cli@1

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: baumstamm-app/src-react/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: baumstamm-app/src-react

      - name: Build WASM package
        run: npm run build:wasm
        working-directory: baumstamm-app/src-react

      - name: Test frontend
        run: npm test
        working-directory: baumstamm-app/src-react

      - name: Build and upload Tauri bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: baumstamm-app
          tauriScript: cargo tauri
          args: --target ${{ matrix.target }}
          releaseId: ${{ github.event.release.id || '' }}
          tagName: ${{ github.event.release.tag_name || '' }}
          releaseDraft: false
          prerelease: ${{ github.event.release.prerelease || false }}
          uploadWorkflowArtifacts: true
