[package]
name = "baumstamm-lib"
version = "0.1.0"
authors = ["Alec Ghost"]
license = "Apache-2.0"
repository = "https://github.com/AlecGhost/baumstamm"
edition.workspace = true
rust-version.workspace = true

[dependencies]
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
itertools = "0.15.0"
thiserror = "2.0.19"
specta = "1.0.5"
getrandom = { version = "0.4.3", features = ["wasm_js"] }

[dependencies.uuid]
version = "1.24.0"
features = [
  "v4",                # Lets you generate random UUIDs
  "rng-getrandom",     # Use getrandom as the UUID randomness source
  "macro-diagnostics", # Enable better diagnostics for compile-time UUIDs
  "serde",
]

[dev-dependencies]
criterion = "0.8.2"
insta = { version = "1.48.0", features = ["yaml"] }
pretty_assertions = "1.4.1"

[[bench]]
name = "performance"
harness = false
